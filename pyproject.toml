[project]
name = "memory-gate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "lingua-language-detector>=2.2.0",
    "openai>=3.46.0",
    "z3-solver>=5.3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["pipeline"]
testpaths = ["tests"]
